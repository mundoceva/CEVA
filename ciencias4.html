<style>
:root{
  --sky:#FFD9B0; --sky2:#FFF5EA; --ink:#3A1F0F; --soft:#7A4A2A;
  --card:#FFFFFF; --cardInk:#3A1F0F; --btn:#FFF0E0; --line:#3A1F0F;
  --accent:#E8590C; --sun:#FFD23F; --ok:#2E9E5B; --bad:#D6336C;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#3A1E10; --sky2:#1A0D06; --ink:#FFEBDD; --soft:#E0B898;
    --card:#2E1A0E; --cardInk:#FFEBDD; --btn:#4A2A16; --line:#E8A877;
    --ok:#46C27A; --bad:#FF6B9A; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;
  background:linear-gradient(to bottom,var(--sky) 0,var(--sky2) 70%);display:flex;flex-direction:column}
.floor{margin-top:auto;height:44px;flex:none;background:repeating-linear-gradient(90deg,#F4E3C8 0 44px,#E5CBA3 44px 88px);border-top:6px solid #C4572A}
main{width:100%;max-width:760px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px}
h1{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(1.7rem,6.5vw,2.5rem);line-height:1;margin:0}
.top{display:flex;align-items:center;gap:12px}
.top .mascot{width:76px;flex:none}
.top .sub{margin:4px 0 0;color:var(--soft);font-weight:800}
.stats{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{background:var(--card);color:var(--cardInk);border:3px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:900;white-space:nowrap}
.album{background:var(--card);color:var(--cardInk);border:3px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.album .row{display:flex;flex-wrap:wrap;gap:6px;font-size:1.7rem;line-height:1}
.album .row span{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--btn)}
.album .row span.lock{font-size:1rem;opacity:.5}
.album p{margin:0;font-weight:800;color:var(--soft);font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;background:var(--card);color:var(--cardInk);
  border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);cursor:pointer;font:inherit}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.card .ic{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:1.8rem;background:var(--btn);border:3px solid var(--line)}
.card b{display:block;font-size:1.08rem}
.card small{display:block;opacity:.75;font-size:.88rem}
.card .st{color:#E0A100;letter-spacing:2px;font-size:1rem}
.card.locked{opacity:.55;cursor:default}
button:focus-visible,.card:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.bar{display:flex;align-items:center;gap:10px}
.btn{font:inherit;font-weight:900;font-size:1.08rem;padding:12px 14px;border-radius:16px;border:3px solid var(--line);
  background:var(--btn);color:var(--cardInk);box-shadow:0 4px 0 var(--line);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.small{font-size:.92rem;padding:8px 12px}
.btn.go{background:var(--accent);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{cursor:default}
.progress{flex:1;height:16px;border-radius:99px;border:3px solid var(--line);background:var(--card);overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.panel{background:var(--card);color:var(--cardInk);border:3px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:10px}
.qlabel{font-weight:900;font-size:1.15rem;margin:0;flex:1}
.speak{width:48px;height:48px;padding:0;font-size:1.4rem;flex:none}
.display{display:flex;flex-direction:column;align-items:center;gap:10px}
.big{font-size:clamp(3rem,16vw,5rem);line-height:1.1;text-align:center}
.pic{display:inline-block;width:112px;height:112px}
.pic svg{width:100%;height:100%;display:block}
.name{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.5rem}
.sentence{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(1.25rem,5.4vw,1.8rem);text-align:center;line-height:1.25}
.lcd{font-family:"Press Start 2P",monospace;font-size:clamp(1.3rem,6vw,2rem);background:#CFE8C8;color:#17324D;border:4px solid #17324D;border-radius:14px;padding:14px 18px;letter-spacing:2px}
.duo{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.duo .arrow{font-size:2.4rem;font-weight:900}
.duo .it{display:flex;flex-direction:column;align-items:center;font-weight:900}
.duo .it .e{font-size:3.2rem;line-height:1.1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opts.pics .btn{font-size:2.6rem;padding:10px 6px;line-height:1.1}
.opts.pics .btn .pic{width:70px;height:70px}
.opts.pics .btn small{display:block;font-size:.85rem}
.feedback{font-size:1.08rem;line-height:1.5;min-height:1.5em}
.feedback b.y{color:var(--ok)} .feedback b.n{color:var(--bad)}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:40px;height:52px;border-bottom:4px solid var(--line);display:grid;place-items:end center;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:2rem;line-height:1.2}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.letters .btn{width:54px;height:54px;padding:0;font-size:1.5rem;font-family:"Baloo 2",sans-serif}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.result{text-align:center;align-items:center}
.result .stars{font-size:2.6rem;color:#E0A100;letter-spacing:6px}
.result .score{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:2.4rem;line-height:1}
.unlock{background:var(--btn);border:3px dashed var(--accent);border-radius:16px;padding:10px 14px;font-weight:900}
.tip{margin:0;line-height:1.5;opacity:.85}
.hero{background:linear-gradient(#FFE6C7,#FFF8EE);border:3px solid var(--line);border-radius:24px;overflow:hidden;margin-bottom:14px}
.hero svg{display:block;width:100%;height:auto}
.homebtn{align-self:flex-start;display:inline-block;font:inherit;font-weight:900;font-size:.95rem;padding:8px 14px;border-radius:999px;border:3px solid #3A1F0F;background:#fff;color:#3A1F0F;text-decoration:none;box-shadow:0 3px 0 #3A1F0F}
[hidden]{display:none!important}
@media (max-width:430px){ .opts:not(.pics){grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){.shake{animation:none}.progress span{transition:none}}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);

/* ---------- VOZ ---------- */
const canSpeak = !!(window.Android&&(Android.speakLang||Android.speak)) || "speechSynthesis" in window;
const speak = t => CEVA.speak(t,"en-GB");
if("speechSynthesis" in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }

/* ---------- DIBUJOS (objetos sin emoji) ---------- */
const K='stroke="#3A1F0F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const DRAW={
  iron:`<path d="M6 46q4-20 26-22h20q6 0 6 6v16Z" fill="#4FC3F7" ${K}/><rect x="4" y="46" width="56" height="7" rx="3" fill="#B0BEC5" ${K}/><path d="M24 24q2-12 14-12h12q6 0 6 6v6" fill="none" ${K} stroke-width="5"/><circle cx="40" cy="36" r="3" fill="#E8590C"/>`,
  hairdryer:`<path d="M10 18h30a14 14 0 0 1 0 28H10Z" fill="#455A64" ${K}/><circle cx="42" cy="32" r="7" fill="#90A4AE" ${K}/><path d="M28 46l-4 14h10l4-14" fill="#455A64" ${K}/><path d="M2 24h5M1 32h6M2 40h5" ${K}/>`,
  heater:`<rect x="14" y="6" width="36" height="50" rx="6" fill="#ECEFF1" ${K}/><rect x="20" y="13" width="24" height="5" rx="2" fill="#FF7043"/><rect x="20" y="22" width="24" height="5" rx="2" fill="#FF7043"/><rect x="20" y="31" width="24" height="5" rx="2" fill="#FF7043"/><rect x="20" y="40" width="24" height="5" rx="2" fill="#FF7043"/><path d="M18 56v4M46 56v4" ${K}/>`,
  oven:`<rect x="8" y="6" width="48" height="52" rx="4" fill="#CFD8DC" ${K}/><path d="M8 18h48" ${K}/><circle cx="18" cy="12" r="2.5" fill="#3A1F0F"/><circle cx="28" cy="12" r="2.5" fill="#3A1F0F"/><circle cx="38" cy="12" r="2.5" fill="#3A1F0F"/><path d="M18 24h28" ${K}/><rect x="15" y="29" width="34" height="22" rx="3" fill="#37474F" ${K}/><path d="M20 46q6-6 12 0" stroke="#FF7043" stroke-width="3" fill="none"/>`,
  microwave:`<rect x="4" y="14" width="56" height="38" rx="4" fill="#ECEFF1" ${K}/><rect x="10" y="20" width="34" height="26" rx="3" fill="#455A64" ${K}/><rect x="48" y="20" width="8" height="6" rx="1" fill="#80CBC4"/><circle cx="50" cy="32" r="1.6" fill="#3A1F0F"/><circle cx="54" cy="32" r="1.6" fill="#3A1F0F"/><circle cx="50" cy="38" r="1.6" fill="#3A1F0F"/><circle cx="54" cy="38" r="1.6" fill="#3A1F0F"/><path d="M8 52v4M56 52v4" ${K}/>`,
  kettle:`<path d="M16 54l4-30h24l4 30Z" fill="#5C6BC0" ${K}/><path d="M22 24q10-12 20 0" fill="#3949AB" ${K}/><path d="M18 36 6 26l3-3 11 6" fill="#5C6BC0" ${K}/><path d="M46 28q12 4 4 20" fill="none" ${K} stroke-width="5"/><rect x="12" y="54" width="40" height="5" rx="2" fill="#37474F" ${K}/>`,
  radiator:`<rect x="6" y="12" width="8" height="42" rx="4" fill="#FAFAFA" ${K}/><rect x="16" y="12" width="8" height="42" rx="4" fill="#FAFAFA" ${K}/><rect x="26" y="12" width="8" height="42" rx="4" fill="#FAFAFA" ${K}/><rect x="36" y="12" width="8" height="42" rx="4" fill="#FAFAFA" ${K}/><rect x="46" y="12" width="8" height="42" rx="4" fill="#FAFAFA" ${K}/><path d="M54 48h6" ${K}/><path d="M18 8q2-4 0-6M30 8q2-4 0-6M42 8q2-4 0-6" stroke="#E8590C" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
  thermometer:`<rect x="26" y="4" width="12" height="42" rx="6" fill="#fff" ${K}/><circle cx="32" cy="52" r="9" fill="#E53935" ${K}/><rect x="30" y="20" width="4" height="30" fill="#E53935"/><path d="M38 12h5M38 20h5M38 28h5M38 36h5" ${K} stroke-width="2"/>`,
  digital:`<path d="M8 50 46 12q6-6 10 0t0 10L18 60q-6 4-10 0t0-10Z" fill="#fff" ${K}/><rect x="24" y="28" width="16" height="9" rx="2" transform="rotate(-45 32 32)" fill="#CFE8C8" ${K} stroke-width="2"/><circle cx="50" cy="16" r="5" fill="#1E88E5" ${K} stroke-width="2"/>`,
  solarpanel:`<path d="M8 42l10-26h40l-10 26Z" fill="#1E3A8A" ${K}/><path d="M21 16l-10 26M34 16l-9 26M46 16l-9 26M13 29h43" stroke="#90CAF9" stroke-width="2"/><path d="M33 42v14M24 56h18" ${K}/>`,
  spoon:`<ellipse cx="20" cy="18" rx="10" ry="13" fill="#B0BEC5" ${K}/><path d="M26 28 52 58" ${K} stroke-width="6"/><path d="M26 28 52 58" stroke="#B0BEC5" stroke-width="2"/>`,
  woodspoon:`<ellipse cx="20" cy="18" rx="10" ry="13" fill="#C68B4E" ${K}/><path d="M26 28 52 58" ${K} stroke-width="6"/><path d="M26 28 52 58" stroke="#C68B4E" stroke-width="2"/>`,
  foil:`<path d="M8 20h36l12 8v20H20L8 40Z" fill="#CFD8DC" ${K}/><path d="M44 20v8h12M14 26l8 4M26 34l10-4M20 44l14-6" stroke="#90A4AE" stroke-width="2" fill="none"/>`,
  pan:`<ellipse cx="26" cy="34" rx="20" ry="14" fill="#455A64" ${K}/><ellipse cx="26" cy="32" rx="14" ry="9" fill="#78909C"/><path d="M44 30h16" ${K} stroke-width="6"/>`
};
const svg = n => `<svg viewBox="0 0 64 64" aria-hidden="true">${DRAW[n]}</svg>`;
/* cosa → [dibujo HTML, español] */
const pic = (e) => DRAW[e]?`<span class="pic">${svg(e)}</span>`:`<span class="big">${e}</span>`;
const smallPic = (e) => DRAW[e]?`<span class="pic" style="width:56px;height:56px">${svg(e)}</span>`:`<span style="font-size:2.4rem">${e}</span>`;

/* ---------- DATOS · Unit 3 Heat and temperature ---------- */
const SOURCES={
  "the Sun":["☀️","n","el Sol"], "volcano":["🌋","n","el volcán"], "hot spring":["♨️","n","la fuente termal"], "hot sand":["🏜️","n","la arena caliente"],
  "iron":["iron","a","la plancha"], "heater":["heater","a","la estufa"], "oven":["oven","a","el horno"], "hairdryer":["hairdryer","a","el secador"],
  "light bulb":["💡","a","la bombilla"], "microwave":["microwave","a","el microondas"], "kettle":["kettle","a","el hervidor"], "radiator":["radiator","a","el radiador"]
};
const SRC=Object.keys(SOURCES);
const KIND={n:"natural",a:"artificial"};

/* Heat or temperature? (frases del libro y alguna más) */
const HT=[
  ["___ is a form of energy.","Heat"],["___ tells us how hot something is.","Temperature"],["___ is something we measure.","Temperature"],
  ["There are natural and artificial sources of ___.","heat"],["Things become hotter when they gain ___.","heat"],["Things become colder when they lose ___.","heat"],
  ["___ makes things warm or hot.","Heat"],["We measure ___ with a thermometer.","temperature"],["The Sun gives us light and ___.","heat"],
  ["Our normal body ___ is around 37 °C.","temperature"],["The air ___ is on the weather forecast.","temperature"]
];

/* Temperaturas */
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function num(n){
  if(n<0) return "minus "+num(-n);
  if(n<20) return ONES[n];
  if(n<100) return TENS[Math.floor(n/10)]+(n%10?"-"+ONES[n%10]:"");
  return "one hundred"+(n%100?" and "+num(n%100):"");
}
const tempWords=(v,u)=>{ const i=Math.trunc(v), d=Math.round(Math.abs(v-i)*10); return `${num(i)}${d?" point "+ONES[d]:""} degrees ${u==="C"?"Celsius":"Fahrenheit"}`; };
const tempTxt=(v,u)=>`${String(v)} °${u}`;

let S=null;
function buildQs(kinds,n){
  const used=new Set(), qs=[]; let tries=0;
  while(qs.length<n&&tries<500){ tries++; const q=GEN[rnd(kinds)](); if(used.has(q.key)) continue; used.add(q.key); qs.push(q); }
  while(qs.length<n) qs.push(GEN[rnd(kinds)]());
  return qs;
}
function start(id){
  S={id,i:0,score:0,answered:false,before:totalStars()};
  if(id==="spell"){ S.words=pick(SPELL,5); S.total=5; }
  else if(id==="final"){ S.qs=buildQs(["sources","heattemp","measure","states","melt","cond","energy"],10); S.total=10; }
  else { S.qs=buildQs([id],8); S.total=8; }
  show("play"); render();
}
function render(){
  $("count").textContent=`${S.i+1}/${S.total}`;
  $("prog").style.width=(S.i/S.total*100)+"%";
  $("fb").innerHTML=""; $("next").hidden=true; S.answered=false;
  if(S.id==="spell") return renderSpell();
  const q=S.qs[S.i];
  $("qLabel").textContent=q.label;
  $("speakBtn").hidden=!canSpeak||!q.ask; $("speakBtn").onclick=()=>speak(q.ask);
  $("disp").innerHTML=q.display;
  $("disp").querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const o=$("opts"); o.innerHTML="";
  o.className="opts"+(q.pics?" pics":"")+(q.one?" one":"");
  q.options.forEach(op=>{ const b=document.createElement("button"); b.className="btn"; b.innerHTML=op.html; b.dataset.val=op.val; b.onclick=()=>choose(op.val,b); o.appendChild(b); });
  if(q.autoSay) speak(q.say);
}
function choose(val,btn){
  if(S.answered) return; S.answered=true;
  const q=S.qs[S.i], ok=val===q.answer;
  [...$("opts").children].forEach(b=>{ b.disabled=true; if(b.dataset.val===q.answer) b.classList.add("ok"); });
  if(!ok) btn.classList.add("bad","shake"); else S.score++;
  $("fb").innerHTML=(ok?'<b class="y">Hot stuff! 🔥</b> ':'<b class="n">Oops!</b> ')+q.explain;
  speak(q.say);
  $("next").hidden=false; $("next").focus();
}

  const w=S.words[S.i]; S.pos=0; S.miss=false;
  $("qLabel").textContent="Listen and spell. Escucha y toca las letras en orden.";
  $("speakBtn").hidden=!canSpeak; $("speakBtn").onclick=()=>speak(w);
  $("disp").innerHTML=`${pic(SPELL_PIC[w])}${canSpeak?say(w):`<div class="sentence">${SPELL_ES[w]}</div>`}<div class="slots" id="slots">${w.split("").map(()=>`<span class="slot"></span>`).join("")}</div>`;
  $("disp").querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const o=$("opts"); o.className="letters";
  let letters=shuffle(w.split("")); if(letters.join("")===w&&w.length>1) letters=shuffle(letters);
  o.innerHTML=letters.map(l=>`<button class="btn" data-l="${l}">${l}</button>`).join("");
  o.querySelectorAll("button").forEach(b=>b.onclick=()=>tapLetter(b));
  speak(w);
}
function tapLetter(b){
  if(S.answered||b.disabled) return;
  const w=S.words[S.i];
  if(b.dataset.l===w[S.pos]){
    $("slots").children[S.pos].textContent=b.dataset.l; b.disabled=true; b.style.visibility="hidden"; S.pos++;
    if(S.pos===w.length){
      S.answered=true; if(!S.miss) S.score++;
      $("fb").innerHTML=(!S.miss?'<b class="y">Amazing!</b> ':'<b class="y">Well done!</b> ')+`“${w}” = ${SPELL_ES[w]}.`;
      speak(w); $("next").hidden=false; $("next").focus();
    }
  } else {
    S.miss=true; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake","bad");
    setTimeout(()=>b.classList.remove("bad"),450);
    $("fb").innerHTML='<b class="n">Esa no va ahora.</b> Pulsa 🔊 y escucha otra vez.';
  }
}

function next(){ S.i++; if(S.i>=S.total) return finish(); render(); }
function finish(){
  $("prog").style.width="100%";
  const st=starsFor(S.score,S.total);
  save.best[S.id]=Math.max(save.best[S.id]||0,st);
  save.gems=(save.gems||0)+st;
  const perfect=S.score===S.total; if(perfect) save.perfect[S.id]=true;
  persist();
  $("rStars").textContent=starStr(st);
  $("rScore").textContent=`${S.score}/${S.total}`;
  const after=totalStars(), news=MILES.filter(m=>S.before<m.at&&after>=m.at);
  const done=GAMES.filter(g=>save.perfect[g.id]).length, all=done===GAMES.length;
  $("rMsg").textContent= all?"¡Todos los juegos sin fallos! Te has ganado el premio."
    : perfect?`¡Todo perfecto! Llevas ${done} de ${GAMES.length} juegos sin fallos.`
    : st===3?"¡Genial! Casi perfecto.":st===2?"¡Muy bien!":st===1?"¡Bien! Sigue practicando.":"Vuelve a intentarlo, ¡tú puedes!";
  const unl=news.map(m=>`${m.st} ¡Nueva pegatina para tu álbum!`).join("<br>");
  $("rUnlock").hidden=!unl; $("rUnlock").innerHTML=unl;
  $("rTip").textContent=(st?`Ganas ${st} 💎. `:"Sin estrellas no hay gemas esta vez. ")+"Truco: "+TIPS[S.id];
  $("gemTotal").textContent=`💎 ${CEVA.wallet(PROFILE)}`;
  $("prize").hidden=!all;
  $("prize").textContent="🎁 Elegir juego de premio";
  show("result"); $("again").focus();
}
$("next").onclick=next;
$("quit").onclick=()=>{ renderMenu(); show("menu"); };
$("again").onclick=()=>start(S.id);
$("toMenu").onclick=()=>{ renderMenu(); show("menu"); };
$("prize").onclick=()=>Premios.choose(k=>{ save.perfect={}; persist(); Premios.start(k,()=>{ save.best={}; save.perfect={}; save.vueltas=(save.vueltas||0)+1; persist(); renderMenu(); show("menu"); }); });

  search:()=>[

  ],
  quiz:()=>{ const q=GEN[rnd(["sources","heattemp","states","cond","energy"])](); return {label:q.label,display:q.display,options:q.options,answer:q.answer}; },

    {title:"Tap only conductors · Toca solo conductores",yes:["metal","iron","gold","silver","aluminium","metal spoon"],no:["wood","plastic","rubber","wool","pencil","wool socks"]},
    {title:"Tap only words about heat · Toca solo palabras del calor",yes:["energy","hot","warm","fire","melt","sun","temperature","volcano"],no:["doctor","pencil","bucket","book","socks","dog"]}
  ]
});
